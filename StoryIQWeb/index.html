<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoryIQ</title>
<style>
html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#f0f0f0; }
body { -webkit-user-select:none; user-select:none; }
#unity-canvas { display:block; width:100%; height:100%; touch-action:none; outline:none; }
#loading { position:fixed; inset:0; display:grid; place-content:center; text-align:center; gap:16px; font:18px system-ui,sans-serif; color:#222; background:#f0f0f0; }
#loading[hidden] { display:none; }
progress { width:240px; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="0" aria-label="Route IQ puzzle game"></canvas>
<div id="loading" role="status"><span id="message">Loading puzzle game…</span><progress id="progress" max="1" value="0"></progress></div>
<script>
const canvas = document.getElementById('unity-canvas');
const loading = document.getElementById('loading');
const message = document.getElementById('message');
const progress = document.getElementById('progress');
const config = {
  dataUrl: 'Build/StoryIQWeb.data.br',
  frameworkUrl: 'Build/StoryIQWeb.framework.js.br',
  codeUrl: 'Build/StoryIQWeb.wasm.br',
  streamingAssetsUrl: 'StreamingAssets',
  companyName: "Buajitti_Associates",
  productName: "StoryIQ",
  productVersion: "1.0",
  matchWebGLToCanvasSize: true
};
function fail(error) { loading.hidden = false; progress.hidden = true; message.textContent = 'Unable to load the game. Please reload the page.'; console.error(error); }
const script = document.createElement('script');
script.src = 'Build/StoryIQWeb.loader.js';
script.onload = () => createUnityInstance(canvas, config, value => { progress.value = value; })
  .then(instance => { window.unityInstance = instance; loading.hidden = true; canvas.focus(); })
  .catch(fail);
script.onerror = fail;
document.body.appendChild(script);
canvas.addEventListener('pointerdown', () => canvas.focus());
canvas.addEventListener('contextmenu', event => event.preventDefault());
</script>
</body>
</html>
